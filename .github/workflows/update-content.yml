name: Update content

on:
  schedule:
    - cron: '0 21 * * 1' # Раз в неделю по понедельникам в 00:00 МСК
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Installing Dependencies
        run: pnpm install --frozen-lockfile

      - name: Update @mdn/browser-compat-data
        run: pnpm add -DE @mdn/browser-compat-data@latest

      - name: Run create:data
        run: pnpm create:data

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update: $(date +'%Y-%m-%d')"
            git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }} HEAD:${{ github.ref }}
          fi
